/* ---------- format helpers ---------- */
const U=x=>{x=+x||0;const a=Math.abs(x);
  if(a>=1e9)return '$'+(x/1e9).toFixed(2)+'B';
  if(a>=1e6)return '$'+(x/1e6).toFixed(1)+'M';
  if(a>=1e3)return '$'+(x/1e3).toFixed(0)+'K';
  return '$'+x.toFixed(0);};
const PC=x=>(x*100).toFixed(0)+'%';
const PC1=x=>(x*100).toFixed(1)+'%';
const NUM=x=>(+x||0).toLocaleString('en-US');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function delta(cur,prev){ if(prev==null||!prev) return '';
  const d=(cur-prev)/prev*100; const c=d>=0?'up':'down';
  return ` <span class="d ${c}">${d>=0?'▲':'▼'}${Math.abs(d).toFixed(1)}%</span>`; }
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

/* ---------- data refs ---------- */
const S=DATA, V=S.volume, SU=S.supply, T=S.tvl, F=S.fees, H=HIST||{};

document.getElementById('win').textContent=S.meta.window_days+'d rolling';

/* ---------- mission clock + elapsed ---------- */
const snapT=Date.parse(S.meta.generated_at);
function tick(){
  const now=new Date();
  document.getElementById('clk').textContent=now.toISOString().slice(11,19);
  let s=Math.max(0,Math.floor((Date.now()-snapT)/1000));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60); s=s%60;
  document.getElementById('elapsed').textContent=
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
tick(); setInterval(tick,1000);

/* ---------- panel builder ---------- */
const grid=document.getElementById('grid');
function panel(id,cols,name,rt,bodyNodes){
  const p=el('div','panel '+cols); p.id=id;
  const hd=el('div','ph','<span class="nm">'+name+'</span>'+
    (rt?'<span class="rt">'+rt+'</span>':''));
  p.appendChild(hd);
  (Array.isArray(bodyNodes)?bodyNodes:[bodyNodes]).forEach(n=>{ if(typeof n==='string')p.insertAdjacentHTML('beforeend',n); else p.appendChild(n); });
  grid.appendChild(p); return p;
}

/* ===== chart helpers (hand-rolled inline SVG; offline-portable, no external lib) ===== */
const CW=720, CH=170, PL=48, PR=14, PT=12, PB=20, IW=CW-PL-PR, IH=CH-PT-PB;
const CORE='var(--core)', FRNT='var(--frontier)';
const CCY_PAL=['var(--frontier)','oklch(0.74 0.135 152)','oklch(0.70 0.16 28)',
  'oklch(0.74 0.115 300)','oklch(0.78 0.10 215)','oklch(0.76 0.12 55)'];
const ccyColor=(c,i)=> c==='eur'?CORE : c==='other'?'oklch(0.52 0.02 140)' : CCY_PAL[i%CCY_PAL.length];
const _xs=(i,n)=> (PL+(n<=1?IW/2:i/(n-1)*IW)).toFixed(1);
const _ys=(v,m)=> (PT+IH-(m>0?v/m*IH:0)).toFixed(1);
function _frame(max,dates){
  let g='<line class="axl" x1="'+PL+'" y1="'+(PT+IH)+'" x2="'+(CW-PR)+'" y2="'+(PT+IH)+'"></line>'+
    '<line class="grid" x1="'+PL+'" y1="'+PT+'" x2="'+(CW-PR)+'" y2="'+PT+'"></line>'+
    '<text class="ax" x="'+(PL-6)+'" y="'+(PT+4)+'" text-anchor="end">'+U(max)+'</text>'+
    '<text class="ax" x="'+(PL-6)+'" y="'+(PT+IH)+'" text-anchor="end">0</text>';
  const n=dates.length;
  if(n){
    g+='<text class="ax" x="'+PL+'" y="'+(CH-5)+'" text-anchor="start">'+dates[0]+'</text>'+
       '<text class="ax" x="'+(CW-PR)+'" y="'+(CH-5)+'" text-anchor="end">'+dates[n-1]+'</text>';
    // interior date ticks: 4 evenly spaced, deduped on label so short series don't repeat
    if(n>=8){
      const seen=new Set([dates[0],dates[n-1]]);
      for(let t=1;t<=4;t++){
        const i=Math.round(t*(n-1)/5), lb=dates[i];
        if(seen.has(lb)) continue; seen.add(lb);
        const x=_xs(i,n);
        g+='<line class="grid" x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+IH)+'"></line>'+
           '<text class="ax" x="'+x+'" y="'+(CH-5)+'" text-anchor="middle">'+lb+'</text>';
      }
    }
  }
  return g;
}
const CHARTS={};   // id -> {type, dates, max, ...} for hover tooltips
const chartBox=(id,inner)=> '<div class="chartbox" data-cid="'+id+'">'+
  '<svg class="chart" viewBox="0 0 '+CW+' '+CH+'" role="img">'+inner+'<g class="hv"></g></svg>'+
  '<div class="tip"></div></div>';

function stackedArea(id,rows,gkey,vkey,topN){
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  if(dates.length<2) return '<div class="cnote">history accrues weekly — not enough days yet.</div>';
  const tot={}; rows.forEach(r=>{tot[r[gkey]]=(tot[r[gkey]]||0)+(+r[vkey]||0);});
  const groups=Object.keys(tot).filter(k=>tot[k]>0).sort((a,b)=>tot[b]-tot[a]);
  const top=groups.slice(0,topN), other=groups.length>topN, keys=[...top,...(other?['other']:[])];
  const di={}; dates.forEach((d,i)=>di[d]=i);
  const ki={}; keys.forEach((k,i)=>ki[k]=i);
  const mat=keys.map(()=>dates.map(()=>0));
  rows.forEach(r=>{ const k=top.indexOf(r[gkey])>=0?r[gkey]:'other', j=ki[k]; if(j==null)return; mat[j][di[r.date]]+=(+r[vkey]||0); });
  const max=Math.max(...dates.map((_,i)=>keys.reduce((s,_,j)=>s+mat[j][i],0)),1);
  let cum=dates.map(()=>0), paths='';
  for(let j=0;j<keys.length;j++){
    const lower=cum.slice(), upper=cum.map((c,i)=>c+mat[j][i]); cum=upper;
    let d='M'+_xs(0,dates.length)+','+_ys(upper[0],max);
    for(let i=1;i<dates.length;i++) d+=' L'+_xs(i,dates.length)+','+_ys(upper[i],max);
    for(let i=dates.length-1;i>=0;i--) d+=' L'+_xs(i,dates.length)+','+_ys(lower[i],max);
    const col=ccyColor(keys[j],j);
    paths+='<path d="'+d+'Z" fill="'+col+'" fill-opacity="0.8" stroke="'+col+'" stroke-width="0.6"></path>';
  }
  const colors=keys.map((k,j)=>ccyColor(k,j));
  CHARTS[id]={type:'stack', dates, keys, colors, mat, max};
  const legend='<div class="legend">'+keys.map((k,j)=>'<span class="lgi"><span class="sw" style="background:'+colors[j]+'"></span>'+esc(k.toUpperCase())+'</span>').join('')+'</div>';
  return chartBox(id,_frame(max,dates.map(d=>d.slice(2,7)))+paths)+legend;
}

function areaChart(id,rows,vkey,color,label){
  const cut=(H.meta&&H.meta.latest_date)||'9999';
  const pts=rows.slice().filter(r=>r.date<=cut).sort((a,b)=>a.date<b.date?-1:1);
  const dates=pts.map(p=>p.date);
  if(dates.length<2) return '<div class="cnote">history accrues weekly — not enough days yet.</div>';
  const vals=pts.map(p=>+p[vkey]||0), max=Math.max(...vals,1);
  let line='M'+_xs(0,dates.length)+','+_ys(vals[0],max);
  for(let i=1;i<dates.length;i++) line+=' L'+_xs(i,dates.length)+','+_ys(vals[i],max);
  const area=line+' L'+_xs(dates.length-1,dates.length)+','+(PT+IH)+' L'+_xs(0,dates.length)+','+(PT+IH)+' Z';
  CHARTS[id]={type:'area', dates, vals, max, color, label:label||''};
  return chartBox(id,_frame(max,dates.map(d=>d.slice(2,7)))+
    '<path d="'+area+'" fill="'+color+'" fill-opacity="0.15"></path>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.6"></path>'+
    '<circle cx="'+_xs(dates.length-1,dates.length)+'" cy="'+_ys(vals[vals.length-1],max)+'" r="2.6" fill="'+color+'"></circle>');
}

/* hover: crosshair + value tooltip, wired after panels mount */
function wireHover(){
  Object.keys(CHARTS).forEach(id=>{
    const box=document.querySelector('[data-cid="'+id+'"]'); if(!box) return;
    const svg=box.querySelector('svg'), hv=svg.querySelector('.hv'), tip=box.querySelector('.tip');
    const C=CHARTS[id], n=C.dates.length;
    function move(clientX){
      const r=svg.getBoundingClientRect(); if(!r.width) return;
      let i=Math.round(((clientX-r.left)/r.width*CW-PL)/IW*(n-1)); i=Math.max(0,Math.min(n-1,i));
      const x=+_xs(i,n); let html, topVal;
      let mk='<line class="cl" x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+IH)+'"></line>';
      if(C.type==='area'){ const v=C.vals[i], y=+_ys(v,C.max); topVal=v;
        mk+='<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="'+C.color+'"></circle>';
        html='<div class="td">'+C.dates[i]+'</div><div class="tr"><span class="tk">'+esc(C.label)+'</span><span class="tv">'+U(v)+'</span></div>';
      } else {
        let cum=0; for(let j=0;j<C.keys.length;j++) cum+=C.mat[j][i]; topVal=cum;
        mk+='<circle cx="'+x+'" cy="'+_ys(cum,C.max)+'" r="3.2" fill="var(--ink)"></circle>';
        const rs=C.keys.map((k,j)=>({k,c:C.colors[j],v:C.mat[j][i]})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
        html='<div class="td">'+C.dates[i]+' · total '+U(cum)+'</div>'+
          rs.map(o=>'<div class="tr"><span class="tk"><span class="sw" style="background:'+o.c+'"></span>'+esc(o.k.toUpperCase())+'</span><span class="tv">'+U(o.v)+'</span></div>').join('');
      }
      hv.innerHTML=mk; tip.innerHTML=html; tip.style.opacity='1';
      const px=x/CW*r.width, py=_ys(topVal,C.max)/CH*r.height;
      tip.style.left=Math.max(6,Math.min(r.width-6,px))+'px';
      tip.style.top=Math.max(2,py)+'px';
    }
    svg.addEventListener('mousemove',e=>move(e.clientX));
    svg.addEventListener('mouseleave',()=>{hv.innerHTML=''; tip.style.opacity='0';});
  });
}

function barRank(items,lkey,vkey,color,n){
  const rows=items.filter(it=>(+it[vkey]||0)>0).sort((a,b)=>(+b[vkey]||0)-(+a[vkey]||0)).slice(0,n||7);
  const max=Math.max(...rows.map(it=>+it[vkey]||0),1);
  return rows.map(it=>{ const v=+it[vkey]||0;
    return '<div class="brow"><div class="bl">'+esc(String(it[lkey]))+'</div>'+
      '<div class="bt"><i style="width:'+(v/max*100).toFixed(1)+'%;background:'+color+'"></i></div>'+
      '<div class="bv">'+U(v)+'</div></div>';
  }).join('');
}

// FX protocols being onboarded into the dataset — shown greyed under the leaderboards to
// signal what's coming, not yet measured.
const INWORK=['StableFX','OpenFX','Codex','Mento','Ratio'];
function inWorkRows(){
  return '<div class="iwsep"></div>'+INWORK.map(p=>
    '<div class="brow inwork"><div class="bl">'+esc(p)+'</div>'+
    '<div class="bt"></div><div class="bv"><span class="iw">IN WORK</span></div></div>').join('');
}

/* ===== TREND CHARTS (real 90d backfill, anchored to the snapshot) ===== */
const HM=H.meta||{}, GRAN=HM.granularity||'weekly';
const ymd=d=>d?d.slice(2,7):'';                         // YYYY-MM-DD -> YY-MM
const rng=rows=>{ if(!rows||!rows.length) return GRAN; const ds=rows.map(r=>r.date).slice().sort();
  return GRAN+' · '+ymd(ds[0])+' → '+ymd(ds[ds.length-1]); };
panel('pSupTrend','col8','Non-USD Stablecoin Supply · by currency', rng(H.supply_by_currency),
  stackedArea('chSup',H.supply_by_currency||[],'currency','circ_usd',6));
(function(){
  const rows=SU.by_currency.slice(0,10);
  let html='';
  rows.forEach(c=>{ const core=c.currency==='eur';
    html+='<div class="row"><div class="lab">'+esc(c.currency)+'</div>'+
      '<div class="meter"><i style="width:'+(c.share*100).toFixed(1)+'%;--mc:'+(core?'var(--core)':'var(--frontier)')+'"></i></div>'+
      '<div class="val">'+U(c.circ_usd)+' · '+PC1(c.share)+'</div></div>';
  });
  panel('pSup','col4','Current Supply','',html);
})();
/* per-currency attribution: drop the usd leg (history credits BOTH sides of each corridor,
   so raw rows sum to 2x the netted total; non-USD crosses still credit both legs) */
const volCcy=(H.volume_by_currency||[]).filter(r=>r.currency!=='usd');
panel('pVolTrend','col6','Onchain FX Volume · by currency', rng(H.volume_total),
  stackedArea('chVol',volCcy,'currency','dedup_usd',6)+
  '<div class="cnote">Weekly dedup volume attributed to the non-USD side of each corridor. Non-USD crosses (e.g. eur/gbp) credit both legs, so the stack runs slightly above the netted total (mean +0.5%).</div>');
(function(){
  const fees={}; (H.fees_daily||[]).forEach(r=>fees[r.date]=+r.fee_usd||0);
  const wk={}; volCcy.forEach(r=>wk[r.date]=(wk[r.date]||0)+(+r.dedup_usd||0));
  const rows=volCcy.filter(r=>wk[r.date]>0&&fees[r.date]!=null)
    .map(r=>({date:r.date,currency:r.currency,fee_usd:fees[r.date]*(+r.dedup_usd||0)/wk[r.date]}));
  panel('pFeeTrend','col6','LP Fees Earned · by currency', rng(H.fees_daily),
    stackedArea('chFee',rows,'currency','fee_usd',6)+
    '<div class="cnote">Derived: weekly fee total (blended effective rate × gross volume) split pro-rata by currency volume share. Trend proxy, not a per-pool fee measurement.</div>');
})();
panel('pProtoVol','col6','Protocols · by FX Volume','7d',
  barRank(S.leaderboard||[],'project','volume_usd',CORE,7)+inWorkRows());
panel('pProtoTvl','col6','Protocols · by Pooled TVL','current',
  barRank(S.leaderboard||[],'project','tvl_usd',FRNT,7)+inWorkRows());

/* ===== DISLOCATION ===== */
(function(){
  const cls=b=>b<10?'g-lo':b<50?'g-mid':'g-hi';
  const w=b=>Math.min(100,Math.log10(Math.max(1,b))/Math.log10(500)*100);
  const cors=[...new Set(S.dislocation.map(d=>d.corridor))];
  let html='';
  cors.forEach(cor=>{
    const rows=S.dislocation.filter(d=>d.corridor===cor);
    html+='<div class="dis-cor"><div class="h">'+esc(cor)+'</div><div class="bands">';
    rows.forEach(d=>{ const c=cls(d.median_bps);
      html+='<div class="band"><div class="bk">'+esc(d.band.split(': ')[1]||d.band)+'</div>'+
        '<div class="bv '+c+'">'+Math.round(d.median_bps)+(d.thin?' ⚑':'')+'</div><div class="bu">bps</div>'+
        '<div class="gb"><i class="'+c+'" style="width:'+w(d.median_bps)+'%;background:currentColor"></i></div>'+
        '<div class="bn">'+NUM(d.n)+' fills</div></div>';
    });
    html+='</div></div>';
  });
  panel('pDis','col5','All-in cost to execute onchain, by trade size','THE OPPORTUNITY',html);
})();

/* ===== CORRIDOR FLOW ===== */
(function(){
  const rows=V.by_corridor.slice(0,12);
  let html='<table><thead><tr><th>Corridor</th><th>Volume/wk</th><th>Senders</th><th>x-infl</th><th>Flag</th></tr></thead><tbody>';
  rows.forEach(c=>{ const mm=c.single_mm;
    html+='<tr class="'+(mm?'cau':'')+'"><td>'+esc(c.pair)+'</td><td>'+U(c.dedup_usd)+'</td>'+
      '<td>'+(mm?'1':NUM(c.senders))+'</td><td>'+(c.roundtrip_inflation?('x'+(+c.roundtrip_inflation).toFixed(2)):'—')+'</td>'+
      '<td>'+(mm?'<span class="tag cau">⚑ MM '+PC(c.top1_share)+'</span>':'')+'</td></tr>';
  });
  html+='</tbody></table>';
  panel('pCorr','col6','Flow · Cross-Currency Corridors','',html);
})();

/* ===== VENUE LEADERBOARD ===== */
(function(){
  const rows=S.leaderboard.slice(0,8);
  let html='<table><thead><tr><th>Venue</th><th>Volume</th><th>TVL</th><th>Fees/wk</th><th>Fee APR</th></tr></thead><tbody>';
  rows.forEach(r=>{ const apr=r.fee_apr?(r.fee_apr<0.01?(r.fee_apr*100).toFixed(1):Math.round(r.fee_apr*100))+'%':'–';
    html+='<tr><td>'+esc(r.project)+'</td><td>'+U(r.volume_usd)+'</td>'+
      '<td>'+(r.tvl_usd>0?U(r.tvl_usd):'<span style="color:var(--faint)">n/a</span>')+'</td>'+
      '<td>'+U(r.fees_usd)+'</td><td>'+apr+(r.tvl_partial?' <span class="tag par">P</span>':'')+'</td></tr>';
  });
  html+='</tbody></table>';
  panel('pLead','col7','Venues · Leaderboard','',html);
})();

/* ===== MARKET MAKER NOTES ===== */
(function(){
  const paths=[
    ['1 · Passive LP','Earn pool fee APR (venue leaderboard). Cost: adverse selection, the pool quotes a stale price while real FX moves, so arb flow extracts from LPs. Baseline strategy, not edge.'],
    ['2 · Prop quoting','Quote inside the AMM off a live FX feed, capture the execution-cost gap (size panel), hedge net inventory offchain. Single-MM corridors above show incumbents already running this.'],
    ['3 · Staleness premium','Pools trade 24/7; offchain hedges close on weekends and off-fix hours. Widen quotes when unhedgeable and earn the risk premium fixed-fee AMM LPs give away.'],
  ];
  panel('pMM','col12','Market Maker Notes','revenue paths',
    paths.map(p=>'<div class="mmrow"><div class="k">'+p[0]+'</div><div class="t">'+p[1]+'</div></div>').join(''));
})();

/* ---------- footer ---------- */
document.getElementById('foot').innerHTML=
  'READ-ONLY MARKET STRUCTURE · NO CAPITAL · NO ON-CHAIN ACTIONS<br>'+
  'SOURCES: Allium · Dune · DeFiLlama · '+
  'Generated '+S.meta.generated_at.slice(0,19).replace('T',' ')+'Z · DQ gate GREEN before publish<br>'+
  'v1 caveats: TVL/fees partial on non-EVM chains · single-MM concentration screen (top-1 sender ≥80%) · FX-gap-by-size + external reference = v1.5';

/* ---------- wire chart hover (panels are mounted) ---------- */
wireHover();

/* ---------- staggered power-on reveal ---------- */
const panels=[...document.querySelectorAll('.panel')];
if(matchMedia('(prefers-reduced-motion:reduce)').matches){ panels.forEach(p=>p.classList.add('rev')); }
else { panels.forEach((p,i)=>setTimeout(()=>p.classList.add('rev'), 90+i*55)); }
</script>
</body></html>
